services:
  api:
    build: .
    container_name: mlops_fastapi_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://mlops:mlops@db:5432/mlops_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: mlops_fastapi_db
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
